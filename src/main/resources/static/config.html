<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Configuration Page</title>
    <link rel="stylesheet" href="css/config.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container-fluid py-3 mb-4 bg-white border-bottom">
    <div class="row align-items-center">

        <div class="col-3">
            <button class="btn btn-dark rounded-pill px-4 fw-bold shadow-sm">
                Load Configuration
            </button>
        </div>

        <div class="col-6 text-center">
            <h2 class="m-0 fw-bold">Configuration Page</h2>
        </div>

        <div class="col-3 d-flex justify-content-end align-items-center gap-3">

            <div class="d-flex align-items-center">
                <span class="fw-bold me-2 small text-muted text-nowrap">Simulation Mode:</span>
                <select class="form-select form-select-sm border-secondary rounded-pill" style="width: auto;" aria-label="Select Simulation Type">
                    <option>Quick Sim</option>
                    <option>Table View</option>
                    <option>Real Time</option>
                </select>
            </div>

            <button class="btn btn-success rounded-pill px-4 fw-bold shadow-sm text-nowrap" onclick="startSimulation()">
                Start Simulation
            </button>
        </div>
    </div>
</div>


<div class="container">
    <div class="row mt-4 ">
        <div class="col">
            <h5>Input Parameters</h5>
            <div class="wrapper d-flex align-items-center mb-2">
                <div class="me-2">
                    <label class="form-label mb-0 small fw-bold field-label text-dark">Number of Runways</label>
                    <div class="text-muted field-range" style="font-size: 0.7rem; line-height: 1;">Range: 0 - 10</div>
                </div>
                <div class="d-flex align-items-center gap-2">
                <button id="minus-button">-</button>

                <div id="runway-counter">10</div>

                <button id="add-button">+</button>
                </div>
            </div>

            <!--            <div class="mb-3">-->
            <!--                <div class="d-flex justify-content-between">-->
            <!--                    <label for="inbound_rate_id" class="form-label mb-1">Inbound Rate /hr</label>-->
            <!--                    <small class="text-muted">Range: 0 - 100</small>-->
            <!--                </div>-->
            <!--                <input id="inbound_rate_id" type="number" name="inbound_rate" class="form-control" min="0" max="100" value="15" required>-->
            <!--            </div>-->
            <div id="input-parameters-list"></div>
        </div>
        <div class="col">
            <div class="mb-2" ><h5>Runways</h5></div>
            <div class="d-flex gap-2 mb-1">
                <span style="min-width: 80px;"></span>

                <label class="fw-bold text-muted small" style="width: 160px;">Status</label>

                <label class="fw-bold text-muted small" style="width: 120px;">Mode</label>
            </div>
            <div id="runway-list"></div>
        </div>
        <div class="col">
            <h5>Scheduled Events</h5>
            <div class="d-flex small text-muted mb-2 px-2 fw-bold pe-4">
                <div class="flex-grow-1">Event</div>   <div style="width: 60px;">Time</div>   <div style="width: 30px;" class="text-end"></div>
            </div>

            <div id="scheduled-events-list" class="rounded p-2 mb-3 border bg-light"
                 style="height: 250px; overflow-y: auto;">

                <div class="text-center text-muted small mt-5" id="empty-list-msg">
                    No events scheduled
                </div>

            </div>

            <div class="rounded p-3 bg-light border">

                <div class="fw-bold mb-2 small text-uppercase text-muted" style="letter-spacing: 0.5px;">New Event</div>

                <div class="row g-2 mb-2">
                    <div class="col-4">
                        <label class="form-label small text-muted mb-0 fw-bold">Type</label>
                        <select id="new-event-type" class="form-select form-select-sm rounded-1" onchange="updateEventForm()">
                            <option value="Runway">Runway</option>
                            <option value="Aircraft">Aircraft</option>
                        </select>
                    </div>

                    <div class="col-8">
                        <label class="form-label small text-muted mb-0 fw-bold">Event</label>
                        <select id="new-event-name" class="form-select form-select-sm rounded-1">
                        </select>
                    </div>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-8">
                        <label class="form-label small text-muted mb-0 fw-bold">Location</label>
                        <select id="new-event-loc" class="form-select form-select-sm rounded-1">
                        </select>
                    </div>

                    <div class="col-4">
                        <label class="form-label small text-muted mb-0 fw-bold">Time</label>
                        <div class="input-group input-group-sm">
                            <input id="new-event-time"
                                   type="number"
                                   min="0"
                                   class="form-control rounded-1 ps-2"> <!-- MUST ADD VALIDATION-->
                            <span class="input-group-text rounded-1 px-1 text-muted">m</span>
                        </div>
                    </div>
                </div>

                <div class="row g-2 mb-3" id="runway-specific-inputs">
                    <div class="col-6">
                        <label class="form-label small text-muted mb-0 fw-bold">New Mode</label>
                        <select id="new-event-mode" class="form-select form-select-sm rounded-1">
                            <option value="none">No Change</option>
                            <option value="MIXED">Mixed</option>
                            <option value="LANDING">Landing</option>
                            <option value="TAKEOFF">Take-Off</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="form-label small text-muted mb-0 fw-bold">Duration</label>
                        <div class="input-group input-group-sm">
                            <input id="new-event-duration" type="number" min="-1" placeholder="-1 = infinite" class="form-control rounded-1 ps-2">
                            <span class="input-group-text rounded-1 px-1 text-muted">m</span>
                        </div>
                    </div>
                </div>

                <button onclick="addEvent()" class="btn btn-dark w-100 fw-bold rounded-1 shadow-sm">
                    <span class="fs-6 me-1">+</span> Schedule Event
                </button>
            </div>

        </div>
    </div>
</div>



<!--TEMPLATE FOR RUNWAY DROPDOWN ROWS-->
<template id="runway-template">
    <div class="d-flex align-items-center gap-2 mb-2 runway-row">

        <span class="fw-bold text-nowrap runway-label" style="min-width: 80px;">Runway X</span>

        <select class="form-select form-select-sm w-auto rounded-pill runway-status" aria-label="Runway Status">
            <option value="available">Available</option>
            <option value="snow">Snow Clearance</option>
            <option value="inspection">Runway Inspection</option>
            <option value="failure">Equipment Failure</option>
        </select>

        <select class="form-select form-select-sm w-auto rounded-pill runway-mode" aria-label="Runway Mode">
            <option value="mixed">Mixed</option>
            <option value="landing">Landing</option>
            <option value="takeoff">Take-Off</option>
        </select>
    </div>
</template>

<!--------------------------->

<!--RUNWAY CONFIG TEMPLATES-->
<template id="input-field-template">
    <div class="mb-2 d-flex justify-content-between align-items-center">

        <div class="me-2">
            <label class="form-label mb-0 small fw-bold field-label text-dark"></label>
            <div class="text-muted field-range" style="font-size: 0.7rem; line-height: 1;"></div>
        </div>

        <input type="number"
               class="form-control form-control-sm rounded-pill ps-3 field-input"
               style="width: 120px; height: 31px;"
               required aria-label="Enter relevant value">
    </div>
</template>

<script src="js/config.js"></script>
</body>
</html>
